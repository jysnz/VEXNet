<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14141a">
<title>VEXNET Field Control</title>
<style>
  :root { --bg:#14141a; --card:#161B22; --sel:#22303c; --cyan:#00F0FF; --orange:#FF8C00;
          --green:#2ECC71; --red:#FF3131; --blue:#3B8BFF; --gray:#8a8a99; --dim:#3a3a46; --white:#e6e6e6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--white);
              font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { padding:14px 16px calc(18px + env(safe-area-inset-bottom)); max-width:1000px; margin:0 auto; }
  button, select, input { font:inherit; color:inherit; }
  button { border:0; border-radius:12px; cursor:pointer; touch-action:manipulation; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  h1 { margin:0; font-size:clamp(24px,6vw,36px); letter-spacing:1px; }
  h2 { margin:0 0 8px; font-size:16px; color:var(--gray); text-transform:uppercase; letter-spacing:1px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .top a { color:var(--gray); text-decoration:none; font-size:14px; }
  .big { display:block; width:100%; padding:clamp(22px,6vw,40px) 16px; font-size:clamp(20px,5vw,30px); font-weight:800; background:var(--card); border:2px solid var(--dim); }
  .big small { display:block; margin-top:6px; font-size:14px; font-weight:500; color:var(--gray); }
  .big.go { background:var(--green); color:#0b0b0f; border-color:var(--green); } .big.go small { color:#0b3d1f; }
  .stack { display:grid; gap:12px; }
  .types { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
  .type { text-align:left; padding:18px; background:var(--card); border:2px solid var(--dim); }
  .type b { display:block; font-size:20px; } .type span { color:var(--gray); font-size:14px; }
  .type:hover:not(:disabled) { border-color:var(--cyan); }
  .panel { background:var(--card); border-radius:14px; padding:14px; }
  .code { font-family:ui-monospace,Consolas,monospace; font-size:clamp(28px,8vw,44px); font-weight:800; letter-spacing:6px; color:var(--cyan); }
  .muted { color:var(--gray); font-size:14px; }
  .status { text-align:center; color:var(--gray); font-weight:700; font-size:clamp(15px,3.6vw,22px); margin:4px 0 0; min-height:1.4em; }
  .clock { text-align:center; font-family:ui-monospace,Consolas,monospace; font-weight:800; font-size:clamp(84px,24vw,190px); line-height:1.05; margin:0; }
  .ctl { display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px; margin:8px 0 6px; }
  .ctl button { padding:18px 8px; font-weight:800; font-size:clamp(16px,4.2vw,22px); }
  .start { background:var(--green); color:#0b0b0f; } .stop { background:var(--red); color:#0b0b0f; } .reset { background:var(--dim); }
  .blockers { color:var(--orange); font-size:14px; min-height:1.3em; margin:2px 2px 10px; }
  .slots { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; }
  .slot { background:var(--card); border:3px solid; border-radius:14px; padding:12px; }
  .slot.red { border-color:var(--red); } .slot.blue { border-color:var(--blue); }
  .slot h3 { margin:0 0 6px; font-size:18px; display:flex; justify-content:space-between; align-items:center; }
  .slot.red h3 { color:var(--red); } .slot.blue h3 { color:var(--blue); }
  .pill { font-size:12px; padding:3px 9px; border-radius:99px; background:var(--dim); color:var(--white); font-weight:700; }
  .pill.ok { background:var(--green); color:#0b0b0f; } .pill.on { background:var(--green); color:#0b0b0f; } .pill.off { background:var(--red); color:#0b0b0f; }
  .st { font-family:ui-monospace,Consolas,monospace; font-size:13px; margin:6px 0; word-break:break-word; min-height:2.4em; }
  select { width:100%; padding:10px; border-radius:10px; background:var(--bg); border:2px solid var(--dim); font-size:15px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row > * { flex:0 0 auto; }
  .small { padding:9px 12px; background:var(--dim); font-weight:700; font-size:14px; }
  .small.cyan { background:var(--cyan); color:#0b0b0f; } .small.red { background:var(--red); color:#0b0b0f; }
  .laptops { display:grid; gap:8px; margin-top:6px; }
  .laptop { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; background:var(--bg); border-radius:10px; }
  input.codein { width:100%; font-size:clamp(28px,8vw,40px); text-align:center; letter-spacing:8px; padding:14px; border-radius:12px;
                 border:2px solid var(--dim); background:var(--card); text-transform:uppercase; font-family:ui-monospace,Consolas,monospace; }
  .err { color:var(--red); min-height:1.3em; margin:8px 0; }
  .warn { background:#3a2a10; color:var(--orange); border-radius:10px; padding:8px 12px; margin-bottom:10px; font-size:13px; display:none; }
  .foot { margin-top:16px; color:var(--gray); font-size:13px; display:flex; gap:8px; align-items:center; }
  .conn { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--red); } .conn.ok { background:var(--green); }
  #pin { position:fixed; inset:0; background:rgba(10,10,15,.96); display:none; align-items:center; justify-content:center; z-index:10; padding:20px; }
  #pin.show { display:flex; }
  #pin form { background:var(--card); padding:24px; border-radius:16px; width:100%; max-width:340px; text-align:center; }
  #pin input { width:100%; font-size:28px; text-align:center; letter-spacing:6px; padding:12px; border-radius:10px; border:2px solid var(--dim); background:var(--bg); margin:14px 0; }
  #pin button { width:100%; padding:14px; background:var(--cyan); color:#0b0b0f; font-weight:800; font-size:18px; }
  #pin p { margin:0; color:var(--gray); }
  #usb { margin-top:18px; }
  #usb input { padding:9px 10px; border-radius:10px; border:2px solid var(--dim); background:var(--bg); font-size:15px; width:12em; }
  .ctrl { display:flex; justify-content:space-between; gap:10px; padding:8px 12px; background:var(--bg); border-radius:10px; font-size:14px; }
  .ctrl b { font-family:ui-monospace,Consolas,monospace; }
  .usbnote { color:var(--orange); font-size:14px; min-height:1.2em; margin-top:8px; }
</style>
</head>
<body>
<div class="warn" id="warn">Storage is in memory: set up Upstash Redis (see README) or matches can disappear between requests.</div>
<div id="app"></div>
<div class="panel" id="usb"></div>
<div class="foot"><span class="conn" id="conn"></span><span id="connText">connecting</span></div>

<div id="pin"><form id="pinForm">
  <p><b>VEXNET Field Control</b></p><p>Enter the control PIN</p>
  <input id="pinInput" type="password" inputmode="numeric" autocomplete="off">
  <button type="submit">Unlock</button><div class="err" id="pinErr"></div>
</form></div>

<script src="/usb-relay.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const app = $("app");

// Builds DOM safely (laptop names come from other machines, so never innerHTML them).
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}

let pin = ""; try { pin = localStorage.getItem("vexnetPin") || ""; } catch (e) {}
let pinResolve = null;
function askPin(msg) {
  $("pin").classList.add("show"); $("pinErr").textContent = msg || ""; $("pinInput").focus();
  return new Promise((res) => { pinResolve = res; });
}
$("pinForm").addEventListener("submit", (e) => {
  e.preventDefault(); pin = $("pinInput").value.trim();
  try { localStorage.setItem("vexnetPin", pin); } catch (e2) {}
  $("pinInput").value = ""; $("pin").classList.remove("show"); audioUnlock();
  if (pinResolve) pinResolve(pin), pinResolve = null;
});

// POST helper: asks for the PIN when needed (and again if it was wrong).
async function post(body, needsPin = true) {
  for (let tries = 0; tries < 3; tries++) {
    if (needsPin && !pin) await askPin("");
    const r = await fetch("/api/match", { method: "POST", headers: { "Content-Type": "application/json", "X-Pin": pin }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) { pin = ""; try { localStorage.removeItem("vexnetPin"); } catch (e) {} await askPin("Wrong PIN"); continue; }
    return { ok: r.ok, data };
  }
  return { ok: false, data: { error: "PIN rejected" } };
}
async function get(url) {
  const r = await fetch(url, { cache: "no-store" });
  return { ok: r.ok, status: r.status, data: await r.json().catch(() => ({})) };
}

// ─── Sounds (this device only): countdown ticks, "Mama!!" at GO, buzzer at the end ───
let audioCtx = null;
const goSound = new Audio("/sounds/go.mp3");
function audioUnlock() { try { goSound.load(); } catch (e) {} }
function tone(hz, ms) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = hz; g.gain.value = 0.2; o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + ms / 1000);
  } catch (e) {}
}
let prev = null;
function sounds(m) {
  if (prev && prev.code === m.code) {
    if (m.countdown && m.countdown !== prev.countdown) tone(880, 150);
    if (m.go && !prev.go) { goSound.currentTime = 0; goSound.play().catch(() => tone(1320, 600)); }
    if (prev.phase === "running" && m.phase === "ended") tone(440, 900);
    if (prev.segment !== m.segment && m.segment === "DRIVER CONTROL" && prev.phase === "running") tone(1320, 400);
  }
  prev = m;
}

// ─── Routing ────────────────────────────────────────────────────────────────
let timer = null, lastOk = 0;
function setConn(ok, t) { $("conn").classList.toggle("ok", ok); $("connText").textContent = t; }
function stopPolling() { if (timer) clearInterval(timer); timer = null; }
function go(hash) { location.hash = hash; }
window.addEventListener("hashchange", route);

function route() {
  stopPolling(); prev = null;
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  if (parts[0] === "create") return viewCreate();
  if (parts[0] === "join") return viewJoin(parts[1] || "");
  if (parts[0] === "m" && parts[1]) return viewMatch(parts[1].toUpperCase());
  viewHome();
}

function header(title, back) {
  return h("div", { class: "top" }, h("h1", {}, title), back ? h("a", { href: back }, "← back") : null);
}

// ─── Home ───────────────────────────────────────────────────────────────────
function viewHome() {
  app.replaceChildren(
    header("VEXNET Field Control"),
    h("div", { class: "stack" },
      h("button", { class: "big go", onclick: () => go("#/create") }, "Create match", h("small", {}, "Skills Challenge, 1v1 or 2v2")),
      h("button", { class: "big", onclick: () => go("#/join") }, "Join match", h("small", {}, "Enter the code from the host's screen"))),
    h("p", { class: "muted", id: "relayInfo" }, "")
  );
  const refresh = async () => {
    try { const { data } = await get("/api/relays"); lastOk = Date.now(); setConn(true, "connected");
      const el = $("relayInfo"); if (el) el.textContent = data.relays.length
        ? "Laptops online: " + data.relays.map((r) => `${r.name} (${r.ports.length} controller${r.ports.length === 1 ? "" : "s"})`).join(", ")
        : "No laptops online yet. On each laptop with controllers, press Connect controller below (Chrome or Edge).";
    } catch (e) { if (Date.now() - lastOk > 3000) setConn(false, "no connection to the server"); }
  };
  refresh(); timer = setInterval(refresh, 2000);
}

// ─── Create ─────────────────────────────────────────────────────────────────
const TYPE_CARDS = [
  ["SKILLS_AUTO", "Skills Challenge", "Autonomous - one robot, 60 s"],
  ["SKILLS_DRIVER", "Skills Challenge", "Driver control - one robot, 60 s"],
  ["M1V1", "1 v 1", "Red vs blue. Autonomous 30 s, then driver control 90 s"],
  ["M2V2", "2 v 2", "Two robots a side, usually two laptops. Autonomous 30 s, then driver control 90 s"],
];
function viewCreate() {
  const err = h("div", { class: "err" });
  const cards = TYPE_CARDS.map(([type, title, desc]) =>
    h("button", { class: "type", onclick: async (e) => {
      e.currentTarget.disabled = true; err.textContent = "";
      const { ok, data } = await post({ action: "create", type });
      if (ok) go("#/m/" + data.code); else { err.textContent = data.error || "could not create the match"; e.target.closest("button").disabled = false; }
    } }, h("b", {}, title), h("span", {}, desc)));
  app.replaceChildren(header("Create match", "#/"), h("p", { class: "muted" }, "Choose the match type."), h("div", { class: "types" }, cards), err);
  setConn(true, "ready");
}

// ─── Join ───────────────────────────────────────────────────────────────────
function viewJoin(prefill) {
  const input = h("input", { class: "codein", maxlength: 6, placeholder: "CODE", autocomplete: "off", value: prefill });
  const err = h("div", { class: "err" });
  const box = h("div", {});
  async function find() {
    err.textContent = ""; box.replaceChildren();
    const code = input.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (code.length < 6) { err.textContent = "The code has 6 characters."; return; }
    const m = await get("/api/match?code=" + code);
    if (!m.ok) { err.textContent = m.data.error || "no match with that code"; return; }
    const { data } = await get("/api/relays");
    const free = data.relays.filter((r) => !m.data.joined.includes(r.name))
      .sort((a, b) => (b.name === usb.name) - (a.name === usb.name));   // this browser's own controllers first
    box.replaceChildren(
      h("p", {}, h("b", {}, m.data.typeTitle), " - tap this laptop to join:"),
      h("div", { class: "laptops" }, free.length ? free.map((r) => h("div", { class: "laptop" },
        h("span", {}, h("b", {}, r.name), "  ", h("span", { class: "muted" }, `${r.ports.length} controller${r.ports.length === 1 ? "" : "s"}: ${r.ports.join(", ") || "none"}`)),
        h("button", { class: "small cyan", onclick: async () => {
          const j = await post({ action: "join", code, relay: r.name }, false);
          if (j.ok) { try { localStorage.setItem("vexnetRelay", r.name); } catch (e) {} go("#/m/" + code); } else err.textContent = j.data.error;
        } }, "This laptop"))) : h("p", { class: "muted" }, "No free laptops online. Connect this laptop's controllers below (or run relay.py), then press Find again.")),
      h("button", { class: "small", style: "margin-top:10px", onclick: () => go("#/m/" + code) }, "Just watch the match"));
  }
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") find(); });
  app.replaceChildren(header("Join match", "#/"), h("div", { class: "stack" }, input, h("button", { class: "big go", onclick: find }, "Find match"), err, box));
  setConn(true, "ready"); input.focus(); if (prefill) find();
}

// ─── Match (lobby + live) ───────────────────────────────────────────────────
function viewMatch(code) {
  let built = false, last = null;
  const el = {};

  async function act(body) {
    const { ok, data } = await post({ ...body, code });
    if (!ok) { el.err.textContent = data.error + (data.blockers && data.blockers.length > 1 ? " (+" + (data.blockers.length - 1) + " more)" : ""); return; }
    el.err.textContent = ""; if (data.closed) return go("#/"); render(data);
  }

  function build(m) {
    el.title = h("h1", {}, m.typeTitle);
    el.code = h("div", { class: "code" }, m.code);
    el.share = h("button", { class: "small", onclick: () => { navigator.clipboard?.writeText(location.origin + "/#/join/" + code); el.share.textContent = "Link copied"; setTimeout(() => el.share.textContent = "Copy join link", 1500); } }, "Copy join link");
    el.status = h("p", { class: "status" }); el.clock = h("p", { class: "clock" });
    el.start = h("button", { class: "start", onclick: () => act({ action: "start" }) }, "START MATCH");
    el.stop = h("button", { class: "stop", onclick: () => act({ action: "stop" }) }, "STOP");
    el.reset = h("button", { class: "reset", onclick: () => act({ action: "reset" }) }, "RESET");
    el.blockers = h("div", { class: "blockers" }); el.err = h("div", { class: "err" });
    el.refereeRed = h("button", { class: "small", onclick: () => act({ action: "toggle", alliance: "red" }) });
    el.refereeBlue = h("button", { class: "small", onclick: () => act({ action: "toggle", alliance: "blue" }) });
    el.slots = h("div", { class: "slots" });
    el.laptops = h("div", { class: "laptops" });
    el.auto = h("button", { class: "small cyan", onclick: () => act({ action: "autoassign" }) }, "Auto-assign controllers");
    el.close = h("button", { class: "small red", onclick: () => { if (confirm("Close this match? Its code stops working.")) act({ action: "close" }); } }, "Close match");
    app.replaceChildren(
      h("div", { class: "top" }, el.title, h("a", { href: "#/" }, "← home")),
      h("div", { class: "panel", style: "margin-bottom:12px" }, h("div", { class: "row", style: "justify-content:space-between" },
        h("div", {}, h("div", { class: "muted" }, "Match code - the other laptop types this to join"), el.code), el.share)),
      el.status, el.clock,
      h("div", { class: "ctl" }, el.start, el.stop, el.reset),
      el.blockers,
      h("div", { class: "row", style: "margin-bottom:12px" }, h("span", { class: "muted" }, "Referee:"), el.refereeRed, el.refereeBlue),
      el.err,
      h("h2", {}, "Robots"), el.slots,
      h("div", { class: "row", style: "margin:14px 0 6px; justify-content:space-between" }, h("h2", { style: "margin:0" }, "Laptops online"), el.auto),
      el.laptops,
      h("div", { style: "margin-top:16px" }, el.close));
    built = true;
  }

  function render(m) {
    last = m;
    if (!built) build(m);
    el.status.textContent = m.status;
    el.clock.textContent = m.clockText; el.clock.style.color = m.clockColor;
    const idle = !m.started, live = m.phase === "countdown" || m.phase === "running";
    el.start.disabled = !m.canStart; el.stop.disabled = !live; el.reset.disabled = !m.canReset;
    el.start.textContent = m.phase === "ended" || m.phase === "stopped" ? "START AGAIN (reset first)" : "START MATCH";
    el.blockers.textContent = idle && m.blockers.length ? "Not ready: " + m.blockers.join("  ·  ") : "";
    for (const [a, btn] of [["red", el.refereeRed], ["blue", el.refereeBlue]]) {
      const hasAlliance = m.slots.some((s) => s.alliance === a);
      btn.style.display = hasAlliance ? "" : "none";
      btn.disabled = m.phase !== "running";
      btn.textContent = m.overrides[a] ? `Enable ${a.toUpperCase()}` : `Disable ${a.toUpperCase()}`;
    }
    // Robots: rebuilt only when something changed, so a dropdown being used isn't closed under the finger.
    const options = [];
    for (const r of m.relays) for (const p of r.ports) options.push({ relay: r.name, port: p });
    const sig = JSON.stringify([m.slots.map((s) => [s.slot, s.relay, s.port, s.ready, s.status, m.enabled[s.alliance]]), options, m.started]);
    if (sig !== el.sig && !(el.slots.contains(document.activeElement) && document.activeElement.tagName === "SELECT")) {
      el.sig = sig;
      el.slots.replaceChildren(...m.slots.map((s) => {
        const sel = h("select", { disabled: m.started, onchange: (e) => {
          const v = e.target.value;
          if (!v) return act({ action: "assign", slot: s.slot, clear: true });
          const [relay, port] = JSON.parse(v); act({ action: "assign", slot: s.slot, relay, port });
        } }, h("option", { value: "" }, "- no controller -"),
          options.map((o) => h("option", { value: JSON.stringify([o.relay, o.port]), selected: o.relay === s.relay && o.port === s.port }, `${o.relay} · ${o.port}`)));
        return h("div", { class: "slot " + s.alliance },
          h("h3", {}, s.label, h("span", { class: "pill " + (m.started ? (m.enabled[s.alliance] ? "on" : "off") : (s.ready ? "ok" : "")) },
            m.started ? (m.enabled[s.alliance] ? "ENABLED" : "DISABLED") : (s.ready ? "READY" : "not ready"))),
          h("div", { class: "st" }, s.status), sel);
      }));
    }
    const lsig = JSON.stringify(m.relays);
    if (lsig !== el.lsig) {
      el.lsig = lsig;
      el.laptops.replaceChildren(...(m.relays.length ? m.relays.map((r) => h("div", { class: "laptop" },
        h("span", {}, h("b", {}, r.name), "  ", h("span", { class: "muted" }, r.ports.join(", ") || "no controllers")),
        r.joined ? h("span", { class: "pill ok" }, "joined") : h("button", { class: "small", disabled: m.started, onclick: () => act({ action: "join", relay: r.name }) }, "Join")))
        : [h("p", { class: "muted" }, "No laptops online. On each laptop with controllers, press Connect controller below (Chrome or Edge).")]));
    }
    $("warn").style.display = m.storage === "memory" ? "block" : "none";
    sounds(m);
  }

  async function poll() {
    try {
      const r = await get("/api/match?code=" + code);
      if (r.status === 404) { stopPolling(); app.replaceChildren(header("Match not found", "#/"), h("p", { class: "muted" }, "That match was closed or the code is wrong.")); return; }
      lastOk = Date.now(); setConn(true, "connected"); render(r.data);
    } catch (e) { if (Date.now() - lastOk > 2500) setConn(false, "no connection to the server"); }
  }
  app.replaceChildren(h("p", { class: "muted" }, "Loading match " + code + "..."));
  poll(); timer = setInterval(poll, 300);
}

// ─── This laptop's controllers (USB, no relay.py needed) ───────────────────────
const usb = UsbRelay.create({ getPin: () => pin, onChange: () => renderUsb() });
const usbEl = {};
function buildUsb() {
  const box = $("usb");
  if (!usb.supported) {
    box.replaceChildren(h("h2", {}, "This laptop's controllers"),
      h("p", { class: "muted", style: "margin:0" }, "To use controllers plugged into this laptop, open this page in Chrome or Edge on it (or run relay.py)."));
    return;
  }
  usbEl.name = h("input", { value: usb.name, maxlength: 30, title: "How this laptop is shown in matches",
    onchange: (e) => { usb.setName(e.target.value); e.target.value = usb.name; } });
  usbEl.list = h("div", { class: "laptops" });
  usbEl.note = h("div", { class: "usbnote" });
  usbEl.pin = h("button", { class: "small", style: "display:none", onclick: () => askPin("") }, "Enter PIN");
  box.replaceChildren(
    h("div", { class: "row", style: "justify-content:space-between; margin-bottom:8px" },
      h("h2", { style: "margin:0" }, "This laptop's controllers"),
      h("div", { class: "row" }, h("span", { class: "muted" }, "Laptop name"), usbEl.name,
        h("button", { class: "small cyan", onclick: () => usb.connect().catch(() => {}) }, "Connect controller"))),
    usbEl.list, h("div", { class: "row" }, usbEl.note, usbEl.pin));
}
function renderUsb() {
  if (!usb.supported) return;
  const cs = usb.controllers();
  const sig = JSON.stringify([cs, usb.note(), usb.online()]);
  if (sig === usbEl.sig) return;
  usbEl.sig = sig;
  usbEl.list.replaceChildren(...(cs.length ? cs.map((c) => h("div", { class: "ctrl" },
      h("span", {}, h("b", {}, c.name), "  ", h("span", { class: "muted" }, c.slot || "not in a match")),
      h("span", { style: "color:" + (c.ok ? "var(--green)" : "var(--gray)") }, c.robot)))
    : [h("p", { class: "muted", style: "margin:0" }, "Plug the controllers in by USB, then press Connect controller once for each (Chrome asks which one).")]));
  const note = usb.note() || (cs.length && !usb.online() ? "connecting to the website..." : "");
  usbEl.note.textContent = note ? note : cs.length ? "Keep this tab open while the match runs." : "";
  usbEl.note.style.color = note ? "" : "var(--gray)";
  usbEl.pin.style.display = /PIN/.test(note) ? "" : "none";
}
buildUsb(); renderUsb();

route();
</script>
</body>
</html>
