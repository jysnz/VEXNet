<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14141a">
<title>VEXNET Field Control</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root { --bg:#14141a; --card:#1b1f27; --bg2:#101015; --gold:#F2C230; --orange:#FF8C00;
          --green:#2ECC71; --red:#FF3131; --blue:#3B8BFF; --gray:#9a9aab; --dim:#343442; --white:#ececf1; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--white);
              font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { padding:0 0 calc(24px + env(safe-area-inset-bottom)); }
  main { max-width:1000px; margin-left:auto; margin-right:auto; }
  .warn { width:calc(100% - 32px); max-width:968px; margin-left:auto; margin-right:auto; }
  main { padding:16px 16px 0; }
  button, select, input { font:inherit; color:inherit; }
  button { border:0; border-radius:12px; cursor:pointer; touch-action:manipulation; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  h1 { margin:0 0 4px; font-size:clamp(24px,6vw,34px); letter-spacing:.5px; }
  h2 { margin:0 0 10px; font-size:14px; color:var(--gray); text-transform:uppercase; letter-spacing:1.2px; }
  .lead { color:var(--gray); margin:0 0 16px; }
  .back { display:inline-flex; align-items:center; gap:6px; margin:0 0 12px; padding:8px 14px 8px 10px; border-radius:99px;
          background:var(--card); border:1px solid var(--dim); color:var(--white); font-weight:600; font-size:14px; }
  .back:hover { border-color:var(--gold); }

  /* top bar: logo (home), where you are, this laptop, connection */
  .bar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:8px 16px;
         background:rgba(16,16,21,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--dim); }
  .brand { display:flex; align-items:center; gap:10px; color:var(--white); text-decoration:none; flex:0 0 auto; }
  .brand img { height:46px; width:auto; display:block; }
  .brand b { display:block; font-size:17px; letter-spacing:1px; } .brand small { display:block; font-size:12px; color:var(--gray); }
  .crumb { flex:1 1 auto; min-width:0; color:var(--gray); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .crumb a { color:var(--gray); text-decoration:none; } .crumb a:hover { color:var(--white); }
  .crumb b { color:var(--white); }
  .chip { flex:0 0 auto; display:flex; align-items:center; gap:7px; padding:7px 11px; border-radius:99px; background:var(--card);
          border:1px solid var(--dim); font-size:13px; font-weight:600; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--gray); flex:0 0 auto; }
  .dot.ok { background:var(--green); } .dot.bad { background:var(--red); } .dot.warn { background:var(--orange); }
  @media (max-width:640px) { .brand span, .crumb { display:none; } .bar { justify-content:space-between; } }

  .panel { background:var(--card); border-radius:14px; padding:16px; }
  .stack { display:grid; gap:12px; }
  .muted { color:var(--gray); font-size:14px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .between { justify-content:space-between; }

  .big { display:block; width:100%; text-align:left; padding:clamp(20px,5vw,30px) 22px; font-size:clamp(20px,5vw,28px); font-weight:800;
         background:var(--card); border:2px solid var(--dim); }
  .big small { display:block; margin-top:6px; font-size:14px; font-weight:500; color:var(--gray); }
  .big.primary { background:var(--gold); color:#16120a; border-color:var(--gold); } .big.primary small { color:#4a3b0a; }
  .big:hover:not(:disabled) { border-color:var(--gold); }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:640px) { .actions { grid-template-columns:1fr; } }

  .check { display:grid; gap:8px; }
  .item { display:flex; align-items:center; gap:12px; padding:12px; background:var(--bg2); border-radius:12px; }
  .item .ic { width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-weight:800; flex:0 0 auto; background:var(--dim); }
  .item.ok .ic { background:var(--green); color:#062b14; } .item.todo .ic { background:var(--orange); color:#2b1a00; }
  .item div { flex:1; } .item b { display:block; } .item span { color:var(--gray); font-size:14px; }
  @media (max-width:640px) { .item { flex-wrap:wrap; } .item div { flex-basis:calc(100% - 40px); } .item button { margin-left:40px; }
                             .block { margin-left:-8px; margin-right:-8px; padding:8px; } }

  .types { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
  .type { text-align:left; padding:18px; background:var(--card); border:2px solid var(--dim); }
  .type b { display:block; font-size:20px; margin-bottom:4px; } .type span { color:var(--gray); font-size:14px; }
  .type em { display:inline-block; font-style:normal; font-size:12px; font-weight:700; padding:2px 8px; border-radius:99px; background:var(--dim); margin-bottom:8px; }
  .type:hover:not(:disabled) { border-color:var(--gold); }

  /* who you are in this match */
  .roles { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:900px) { .roles { grid-template-columns:1fr 1fr; } }
  @media (max-width:640px) { .roles { grid-template-columns:1fr; } }
  .role.tv { border-color:var(--white); }
  .role { text-align:left; padding:22px 18px; background:var(--card); border:3px solid var(--dim); }
  .role b { display:block; font-size:22px; margin-bottom:6px; } .role span { color:var(--gray); font-size:14px; }
  .role.red { border-color:var(--red); } .role.red b { color:var(--red); }
  .role.blue { border-color:var(--blue); } .role.blue b { color:var(--blue); }
  .role.gm { border-color:var(--gold); } .role.gm b { color:var(--gold); }
  .role:hover:not(:disabled) { background:var(--bg2); }
  .youare { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; margin-bottom:12px;
            border-radius:12px; border:2px solid var(--dim); background:var(--card); font-weight:700; }
  .youare.red { border-color:var(--red); } .youare.blue { border-color:var(--blue); } .youare.gm { border-color:var(--gold); }

  /* broadcast: the match full screen on a TV, nothing to press */
  /* the controllers panel is for the alliances' laptops: the game master and watchers don't get it on the match page */
  body.nousb #usb, body.nousb #laptopChip { display:none; }
  body.tv { padding:0; } body.tv .bar, body.tv #usb, body.tv #warn { display:none !important; } body.tv main { max-width:none; padding:0; }
  .tvwrap { min-height:100vh; display:flex; flex-direction:column; padding:2.5vh 3vw; gap:1.5vh; }
  .tvtop { display:flex; justify-content:space-between; align-items:center; gap:2vw; }
  .tvtop img { height:8vh; } .tvtop .title { font-size:4.2vh; font-weight:800; letter-spacing:.1vh; }
  .tvtop .tvcode { font-family:ui-monospace,Consolas,monospace; font-size:4.2vh; font-weight:800; color:var(--gold); letter-spacing:.6vh; }
  .tvstatus { text-align:center; font-size:5.5vh; font-weight:800; color:var(--gray); letter-spacing:.2vh; }
  .tvclock { text-align:center; font-family:ui-monospace,Consolas,monospace; font-weight:800; font-size:min(30vw,36vh); line-height:1; }
  .tvsides { display:grid; grid-template-columns:1fr 1fr; gap:2vw; flex:1; align-items:start; }
  .tvsides.one { grid-template-columns:1fr; max-width:60vw; margin:0 auto; width:100%; }
  .tvside { border-radius:2vh; padding:2vh 2vw; border:.6vh solid; background:var(--card); }
  .tvside.red { border-color:var(--red); } .tvside.blue { border-color:var(--blue); }
  .tvside h3 { margin:0 0 1.2vh; font-size:4.5vh; letter-spacing:.3vh; } .tvside.red h3 { color:var(--red); } .tvside.blue h3 { color:var(--blue); }
  .tvrobot { display:flex; justify-content:space-between; align-items:center; font-size:3.4vh; font-weight:700; padding:.8vh 0; }
  .tvrobot .pill { font-size:2.4vh; padding:.5vh 1.4vh; }
  .tvjoin { text-align:center; font-size:3vh; color:var(--gray); } .tvjoin b { color:var(--gold); font-family:ui-monospace,Consolas,monospace; letter-spacing:.4vh; }
  .tvtap { position:fixed; inset:0; background:rgba(10,10,15,.85); display:flex; align-items:center; justify-content:center; z-index:20; border-radius:0; }
  .tvtap span { font-size:4vh; font-weight:800; padding:3vh 5vw; border:.4vh solid var(--gold); border-radius:2vh; color:var(--gold); }
  .tvexit { position:fixed; right:1vw; bottom:1vh; opacity:.25; } .tvexit:hover { opacity:1; }

  .code { font-family:ui-monospace,Consolas,monospace; font-size:clamp(28px,8vw,42px); font-weight:800; letter-spacing:6px; color:var(--gold); }
  .small { padding:9px 13px; background:var(--dim); font-weight:700; font-size:14px; }
  .small.gold { background:var(--gold); color:#16120a; } .small.red { background:var(--red); color:#0b0b0f; }
  .small.ghost { background:transparent; border:1px solid var(--dim); color:var(--gray); }

  /* the match guide */
  .steps { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  @media (max-width:640px) { .steps { grid-template-columns:1fr 1fr; } }
  .step { padding:9px 10px; border-radius:10px; background:var(--bg2); font-size:13px; color:var(--gray); border:2px solid transparent; display:flex; align-items:center; gap:8px; }
  .step i { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-weight:800; background:var(--dim); color:var(--white); flex:0 0 auto; }
  .step.done { color:var(--white); } .step.done i { background:var(--green); color:#062b14; }
  .step.now { border-color:var(--gold); color:var(--white); } .step.now i { background:var(--gold); color:#16120a; }
  .next { display:flex; gap:10px; align-items:flex-start; margin-top:12px; font-size:16px; font-weight:600; }
  .next .tag { flex:0 0 auto; font-size:12px; font-weight:800; padding:3px 9px; border-radius:99px; background:var(--gold); color:#16120a; margin-top:2px; }
  .next small { display:block; font-weight:400; color:var(--gray); font-size:14px; margin-top:4px; }
  .glow { animation:glow 1.4s ease-in-out infinite; }
  @keyframes glow { 0%,100% { box-shadow:0 0 0 0 rgba(242,194,48,0); } 50% { box-shadow:0 0 0 5px rgba(242,194,48,.6); } }
  @media (prefers-reduced-motion:reduce) { .glow { animation:none; box-shadow:0 0 0 4px rgba(242,194,48,.6); } }

  .status { text-align:center; color:var(--gray); font-weight:700; font-size:clamp(15px,3.6vw,22px); margin:14px 0 0; min-height:1.4em; }
  .clock { text-align:center; font-family:ui-monospace,Consolas,monospace; font-weight:800; font-size:clamp(84px,24vw,180px); line-height:1.05; margin:0; }
  .ctl { display:flex; flex-wrap:wrap; gap:10px; margin:8px 0 6px; }
  .ctl button { flex:1 1 7em; padding:18px 8px; font-weight:800; font-size:clamp(16px,4.2vw,22px); }
  .ctl .start { flex:2 1 14em; }
  .start { background:var(--green); color:#0b0b0f; } .stop { background:var(--red); color:#0b0b0f; } .reset { background:var(--dim); }
  .start.pause { background:var(--orange); color:#2b1a00; }
  .skip { background:var(--card); border:2px solid var(--orange) !important; color:var(--orange); }
  .end { background:var(--card); border:2px solid var(--red) !important; color:var(--red); }
  .final { text-align:center; } .final .clock { color:var(--gray); }
  .referee { margin:4px 0 10px; }

  /* robots: one column per alliance (red left, blue right), stacked on a phone */
  .slots { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; align-items:start; }
  .alliance { display:grid; gap:12px; }
  .alliance h4 { margin:0; font-size:13px; letter-spacing:1.2px; text-transform:uppercase; }
  .alliance.red h4 { color:var(--red); } .alliance.blue h4 { color:var(--blue); }
  .slot { background:var(--card); border:3px solid; border-radius:14px; padding:12px; }
  .slot.red { border-color:var(--red); } .slot.blue { border-color:var(--blue); }
  .slot h3 { margin:0 0 6px; font-size:18px; display:flex; justify-content:space-between; align-items:center; }
  .slot.red h3 { color:var(--red); } .slot.blue h3 { color:var(--blue); }
  .pill { font-size:12px; padding:3px 9px; border-radius:99px; background:var(--dim); color:var(--white); font-weight:700; }
  .pill.ok, .pill.on { background:var(--green); color:#0b0b0f; } .pill.off { background:var(--red); color:#0b0b0f; } .pill.wait { background:var(--orange); color:#2b1a00; }
  .st { font-size:14px; margin:6px 0 8px; word-break:break-word; min-height:2.4em; color:var(--gray); }
  select { width:100%; padding:10px; border-radius:10px; background:var(--bg2); border:2px solid var(--dim); font-size:15px; }
  .section { margin-top:22px; }
  .block { padding:12px; margin-left:-14px; margin-right:-14px; border:2px solid transparent; border-radius:14px; }
  .block.hint { border-color:var(--gold); }
  .laptops { display:grid; gap:8px; }
  .laptop { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 12px; background:var(--bg2); border-radius:10px; }

  input.codein { width:100%; font-size:clamp(28px,8vw,40px); text-align:center; letter-spacing:8px; padding:14px; border-radius:12px;
                 border:2px solid var(--dim); background:var(--card); text-transform:uppercase; font-family:ui-monospace,Consolas,monospace; }
  .err { color:var(--red); min-height:1.3em; margin:8px 0; }
  .warn { background:#3a2a10; color:var(--orange); border-radius:10px; padding:8px 12px; margin-top:10px; font-size:13px; display:none; }

  #pin { position:fixed; inset:0; background:rgba(10,10,15,.96); display:none; align-items:center; justify-content:center; z-index:10; padding:20px; }
  #pin.show { display:flex; }
  #pin form { background:var(--card); padding:24px; border-radius:16px; width:100%; max-width:340px; text-align:center; }
  #pin img { height:64px; }
  #pin input { width:100%; font-size:28px; text-align:center; letter-spacing:6px; padding:12px; border-radius:10px; border:2px solid var(--dim); background:var(--bg); margin:14px 0; }
  #pin button { width:100%; padding:14px; background:var(--gold); color:#16120a; font-weight:800; font-size:18px; }
  #pin p { margin:4px 0 0; color:var(--gray); }

  #usb { width:calc(100% - 32px); max-width:968px; margin:28px auto 0; scroll-margin-top:80px; }
  #usb input { padding:9px 10px; border-radius:10px; border:2px solid var(--dim); background:var(--bg2); font-size:15px; width:12em; }
  .ctrl { display:flex; justify-content:space-between; gap:10px; padding:10px 12px; background:var(--bg2); border-radius:10px; font-size:14px; }
  .ctrl b { font-family:ui-monospace,Consolas,monospace; }
  .usbnote { color:var(--orange); font-size:14px; min-height:1.2em; margin-top:8px; }
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="#/" title="Home"><img src="/qcu-robotics-logo.png" alt="QCU Robotics"><span><b>VEXNET</b><small>Field Control</small></span></a>
  <nav class="crumb" id="crumb" aria-label="You are here"></nav>
  <button class="chip" id="laptopChip" title="This laptop's controllers"><span class="dot" id="laptopDot"></span><span id="laptopText">This laptop</span></button>
  <span class="dot" id="conn" title="connecting"></span>
</header>
<div class="warn" id="warn">Storage is in memory: set up Upstash Redis (see README) or matches can disappear between requests.</div>
<main id="app"></main>
<section class="panel" id="usb"></section>

<div id="pin"><form id="pinForm">
  <img src="/qcu-robotics-logo.png" alt="QCU Robotics">
  <p><b>VEXNET Field Control</b></p><p>Enter the control PIN</p>
  <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN">
  <button type="submit">Unlock</button><div class="err" id="pinErr"></div>
</form></div>

<script src="/usb-relay.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const app = $("app");

// Builds DOM safely (laptop names come from other machines, so never innerHTML them).
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} },
};
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

let pin = store.get("vexnetPin");
let pinResolve = null;
function askPin(msg) {
  $("pin").classList.add("show"); $("pinErr").textContent = msg || ""; $("pinInput").focus();
  return new Promise((res) => { pinResolve = res; });
}
$("pinForm").addEventListener("submit", (e) => {
  e.preventDefault(); pin = $("pinInput").value.trim();
  store.set("vexnetPin", pin);
  $("pinInput").value = ""; $("pin").classList.remove("show"); audioUnlock();
  if (pinResolve) pinResolve(pin), pinResolve = null;
});

// This browser, for the match's one game master: the device that claimed it is the only one its controls answer.
const device = store.get("vexnetDevice") || (() => { const d = "dev-" + Math.random().toString(36).slice(2, 12); store.set("vexnetDevice", d); return d; })();

// POST helper: asks for the PIN when needed (and again if it was wrong).
async function post(body, needsPin = true) {
  for (let tries = 0; tries < 3; tries++) {
    if (needsPin && !pin) await askPin("");
    const r = await fetch("/api/match", { method: "POST", headers: { "Content-Type": "application/json", "X-Pin": pin }, body: JSON.stringify({ device, ...body }) });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) { pin = ""; store.set("vexnetPin", ""); await askPin("Wrong PIN"); continue; }
    return { ok: r.ok, data };
  }
  return { ok: false, data: { error: "PIN rejected" } };
}
async function get(url) {
  const r = await fetch(url, { cache: "no-store" });
  return { ok: r.ok, status: r.status, data: await r.json().catch(() => ({})) };
}

// ─── Sounds (this device only): countdown ticks, "Mama!!" at GO, buzzer at the end ───
let audioCtx = null;
const goSound = new Audio("/sounds/go.mp3");
function audioUnlock() { try { goSound.load(); } catch (e) {} }
function tone(hz, ms) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = hz; g.gain.value = 0.2; o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + ms / 1000);
  } catch (e) {}
}
let prev = null;
function sounds(m) {
  if (prev && prev.code === m.code) {
    if (m.countdown && m.countdown !== prev.countdown) tone(880, 150);
    if (m.go && !prev.go) { goSound.currentTime = 0; goSound.play().catch(() => tone(1320, 600)); }
    if (prev.phase === "running" && (m.phase === "ended" || m.phase === "waiting")) tone(440, 900);
    if (prev.phase !== m.phase && (m.phase === "paused" || (prev.phase === "paused" && m.phase === "running"))) tone(660, 250);
  }
  prev = m;
}

// ─── Top bar ────────────────────────────────────────────────────────────────
let timer = null, lastOk = 0;
function setConn(ok, t) { const d = $("conn"); d.className = "dot " + (ok ? "ok" : "bad"); d.title = "Server: " + t; }
// crumbs: [[label, href], ..., [current]]
function setCrumb(...parts) {
  $("crumb").replaceChildren(...parts.flatMap(([label, href], i) =>
    [i ? " › " : "", href ? h("a", { href }, label) : h("b", {}, label)]));
}
$("laptopChip").addEventListener("click", () => $("usb").scrollIntoView({ behavior: "smooth" }));

function stopPolling() { if (timer) clearInterval(timer); timer = null; }
function go(hash) { location.hash = hash; }
window.addEventListener("hashchange", route);

let refreshHome = null; // redraws the home checklist when this laptop's controllers change
// "← Back": to the page this one was opened from in the app, or to Home when it was opened directly (a join link).
let pagesSeen = 0;
function backButton() {
  return h("button", { class: "back", onclick: () => (pagesSeen > 1 ? history.back() : go("#/")) },
    "← ", pagesSeen > 1 ? "Back" : "Home");
}

function route() {
  pagesSeen++;
  stopPolling(); prev = null; refreshHome = null; window.scrollTo(0, 0); gmLaptopInMatch = false;
  document.body.classList.remove("tv", "nousb");
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  if (parts[0] === "create") return viewCreate();
  if (parts[0] === "join") return viewJoin(parts[1] || "");
  if (parts[0] === "role" && parts[1]) return viewRole(parts[1].toUpperCase());
  if (parts[0] === "m" && parts[1]) return viewMatch(parts[1].toUpperCase());
  if (parts[0] === "tv" && parts[1]) return viewTv(parts[1].toUpperCase());
  viewHome();
}

// ─── Home ───────────────────────────────────────────────────────────────────
function viewHome() {
  setCrumb(["Home"]);
  const check = h("div", { class: "check" });
  const online = h("p", { class: "muted", style: "margin:12px 0 0" });

  let laptops = [];

    const items = [];
    if (!usb.supported) {
      items.push(["info", "Controllers connect on a laptop", "This browser can host or watch. On the laptop with the controllers, open this site in Chrome or Edge."]);
    } else {
      items.push(cs.length
        ? ["ok", plural(cs.length, "controller") + " connected", cs.map((c) => c.name).join(", ") + ` · shown as ${usb.name}`]
        : ["todo", "Connect this laptop's controllers", "Plug them in by USB, then press Connect controller at the bottom of the page.", "Connect controller", () => usb.connect().catch(() => {})]);
      if (cs.length) items.push(replying === cs.length
        ? ["ok", "Robots replying", `${replying} of ${cs.length} ready for field control`]
        : ["todo", `Robots replying: ${replying} of ${cs.length}`, "Turn each robot on and run its program (built with the fieldctl library, VEXNET on)."]);
    }
    check.replaceChildren(...items.map(([state, title, text, btn, fn]) => h("div", { class: "item " + state },
      h("span", { class: "ic" }, state === "ok" ? "✓" : state === "todo" ? "!" : "i"),
      h("div", {}, h("b", {}, title), h("span", {}, text)),
      btn ? h("button", { class: "small gold", onclick: fn }, btn) : null)));
    online.textContent = laptops.length
      ? "Laptops online: " + laptops.map((r) => `${r.name} (${plural(r.ports.length, "controller")})`).join(", ")
      : "No laptops online yet.";
  };
  const poll = async () => {
    try { const { data } = await get("/api/relays"); laptops = data.relays; lastOk = Date.now(); setConn(true, "connected"); }
    catch (e) { if (Date.now() - lastOk > 3000) setConn(false, "no connection"); }
    refreshHome?.();
  };
  refreshHome(); poll(); timer = setInterval(poll, 2000);
}

// ─── Role: red alliance, blue alliance or game master ──────────────────────────
// Remembered per match on this device. Only the game master (who has the PIN) runs the match; an alliance
// laptop joins with the code alone and its controllers drive that alliance's robots.
const roleKey = (code) => "vexnetRole:" + code;
const getRole = (code) => store.get(roleKey(code));
function setRole(code, role) { store.set(roleKey(code), role); }
const ROLE_NAME = { red: "RED alliance", blue: "BLUE alliance", gm: "Game master", watch: "Watching", tv: "Broadcast" };

function viewRole(code) {
  setCrumb(["Home", "#/"], [`Match ${code}`, "#/m/" + code], ["Your role"]);
  const err = h("div", { class: "err" });
  const box = h("div", {});
  app.replaceChildren(h("p", { class: "muted" }, "Loading match " + code + "..."));

  // Red / blue: this laptop takes that side at once. No controller to pick: whatever it has connected now or
  // connects later fills its side's slots by itself. (A browser without USB can hand the side to a relay.py laptop.)
  async function joinAlliance(alliance, m) {
    err.textContent = ""; box.replaceChildren();
    const finish = (relay) => { setRole(code, alliance); store.set("vexnetJoinedMatch", code); store.set("vexnetRelay", relay); go("#/m/" + code); };
    if (usb.supported) {
      const j = await post({ action: "join", code, relay: usb.name, alliance, robots: usb.reports() }, false);
      return j.ok ? finish(usb.name) : (err.textContent = j.data.error);
    }
    const { data } = await get("/api/relays");
    const free = data.relays.filter((r) => !m.joined.includes(r.name));
    box.replaceChildren(h("div", { class: "panel section" },
      h("h2", {}, `The ${alliance} alliance's laptop`),
      h("p", { class: "muted", style: "margin:0 0 10px" }, free.length
        ? "This browser can't use USB controllers. Pick the laptop running relay.py, or open this site in Chrome or Edge on the laptop the controllers are plugged into."
        : "This browser can't use USB controllers. Open this site in Chrome or Edge on the laptop they are plugged into."),
      free.length ? h("div", { class: "laptops" }, free.map((r) => h("div", { class: "laptop" },
        h("span", {}, h("b", {}, r.name), h("br"), h("span", { class: "muted" }, `${plural(r.ports.length, "controller")}: ${r.ports.join(", ") || "none"}`)),
        h("button", { class: "small gold", onclick: async () => {
          const j = await post({ action: "join", code, relay: r.name, alliance }, false);
          if (j.ok) finish(r.name); else err.textContent = j.data.error;
        } }, "Use this laptop")))) : null));
  }

  // Game master: one device per match. Another one can take over (with the PIN) when the first went away.
  async function gameMaster(m) {
    err.textContent = "";
    const takeover = Boolean(m.gmDevice && m.gmDevice !== device);
    if (takeover && !confirm("This match already has a game master on another device. Take over? That device loses the controls.")) return;
    const { ok, data } = await post({ action: "claim", code, takeover, laptop: usb.name });   // asks for the PIN, and again if it's wrong
    if (!ok) { err.textContent = data.error === "PIN rejected" ? "The game master needs the control PIN." : data.error; return; }
    setRole(code, "gm"); go("#/m/" + code);
  }

  get("/api/match?code=" + code).then(({ ok, data: m }) => {
    if (!ok) {
      app.replaceChildren(backButton(), h("h1", {}, "Match not found"), h("p", { class: "lead" }, "That match was closed or the code is wrong."));
      return;
    }
    const has = (a) => m.slots.some((s) => s.alliance === a);
    // One laptop per robot on each side (2 in a 2v2). Full = no place left for this laptop; its own side stays open.
    const onSide = (a) => m.alliances[a] || [];
    const full = (a) => onSide(a).length >= m.seats[a] && !onSide(a).includes(usb.name);
    const sideText = (a) => {
      if (!has(a)) return "Not in this match type.";
      if (full(a)) return `Full: ${onSide(a).join(", ")}.`;
      const left = m.seats[a] - onSide(a).length;
      const who = onSide(a).length ? `${onSide(a).join(", ")} joined, room for ${plural(left, "more laptop")}. ` : "";
      return who + `Your controllers drive ${m.seats[a] > 1 ? `the ${a} robots` : `the ${a} robot`}. The game master runs the match.`;
    };
    const gmTaken = Boolean(m.gmDevice && m.gmDevice !== device);
    const card = (cls, title, text, onclick, disabled) =>
      h("button", { class: "role " + cls, disabled, onclick: (e) => {
        const btn = e.currentTarget; btn.disabled = true;
        Promise.resolve(onclick()).finally(() => { btn.disabled = false; });
      } },
        h("b", {}, title), h("span", {}, text));
    app.replaceChildren(...[backButton(),
      h("div", { class: "row between", style: "margin-bottom:12px" },
        h("div", {}, h("h1", {}, m.typeTitle), h("div", { class: "muted" }, "Who are you in this match?")),
        h("div", { class: "code" }, m.code)),
      h("div", { class: "roles" },
        card("red", "Red alliance", sideText("red"), () => joinAlliance("red", m), !has("red") || full("red") || m.started),
        card("blue", "Blue alliance", sideText("blue"), () => joinAlliance("blue", m), !has("blue") || full("blue") || m.started),
        card("gm", "Game master", gmTaken ? "Taken by another device. Tap to take over (needs the control PIN)."
          : "Starts, pauses and stops the match and assigns controllers. Needs the control PIN.", () => gameMaster(m), false),
        card("tv", "Broadcast", "Shows the match full screen on a TV: the clock and both alliances, nothing to press. Any number of screens.",
          () => { setRole(code, "tv"); go("#/tv/" + code); }, false)),
      m.started ? h("p", { class: "muted" }, "This match has started: alliances can join the next one after RESET.") : null,
      err, box,
      h("button", { class: "small ghost", style: "margin-top:12px", onclick: () => { setRole(code, "watch"); go("#/m/" + code); } }, "Just watch the match")].filter(Boolean));
  }).catch(() => app.replaceChildren(backButton(), h("p", { class: "err" }, "Can't reach the website.")));
}

// ─── Match (lobby + live) ───────────────────────────────────────────────────
// What to do next, from the match state: the step tracker, the sentence, and which button to point at.
function guide(m) {
  const steps = ["Laptop joined", "Controllers assigned", "Robots ready", "Start"];
  const joined = m.joined.length > 0;
  const assigned = m.slots.every((s) => s.relay);
  const ready = m.slots.every((s) => s.ready);
  let now = !joined ? 0 : !assigned ? 1 : !ready ? 2 : 3;
  let text, sub = "", target;
  if (m.phase === "countdown" || m.phase === "running") {
    now = 4; target = null;
    text = m.phase === "countdown" ? `Get ready - ${m.periodTitle.toLowerCase()} is about to start.` : `Match running: ${m.status.toLowerCase()}.`;
    sub = m.periodTitle === "AUTONOMOUS" && m.program.length > 1
      ? "When autonomous ends the robots wait disabled: driver control starts when you press START DRIVER CONTROL."
      : m.canPause ? "PAUSE disables the robots and stops the clock. STOP ends the match." : "STOP ends it early. The referee buttons disable one alliance.";
  } else if (m.phase === "waiting") {
    now = 4; target = "start";
    text = `${m.skippedAuto ? "Autonomous skipped" : "Autonomous over"} - robots disabled.`;
    sub = `When the drivers are ready, press START ${m.periodTitle}: 3-2-1, then ${m.periodTitle.toLowerCase()}.`;
  } else if (m.phase === "paused") {
    now = 4; target = "start";
    text = `${m.periodTitle[0] + m.periodTitle.slice(1).toLowerCase()} paused at ${m.clockText} - robots disabled.`;
    sub = "Press RESUME to carry on from here.";
  } else if (m.phase === "ended" || m.phase === "stopped") {
    now = 4; text = "Match over."; sub = "Press RESET to set up the next one (same robots, same code)."; target = "reset";
  } else if (now === 0) {
    target = "laptops";
    text = m.relays.length ? "Join the laptop that has the controllers." : "No laptop with controllers is online yet.";
    sub = m.relays.length ? "Press Join next to it under Laptops." : "On that laptop, open this site in Chrome or Edge and press Connect controller (bottom of the page).";
  } else if (now === 1) {
    target = "auto"; text = "Give each robot a controller."; sub = "Press Auto-assign controllers, or pick one in each robot's list.";
  } else if (now === 2) {
    const s = m.slots.find((x) => !x.ready);
    target = "slots"; text = `${s.label} isn't ready: ${s.status}.`;
    sub = "Turn the robot on and run its program (VEXNET on). Its controller must be paired to it.";
  } else {
    target = "start"; text = "Everything is ready.";
    sub = m.hasAuto ? "Press START MATCH, or SKIP AUTONOMOUS to go straight to driver control." : "Press START MATCH.";
  }
  return { steps, now, text, sub, target };
}

// The alliances' version of the guide: where their own robots stand; the game master does everything else.
function allianceGuide(m, role) {
  const g = guide(m);
  g.target = null;
  const mine = m.slots.filter((s) => s.alliance === role);
  if (role === "watch" || !mine.length) { g.sub = "The game master runs the match."; return g; }
  if (m.started) { g.sub = "The game master runs the match: start, pause, stop and the referee buttons are on their screen."; return g; }
  const missing = mine.find((s) => !s.relay), notReady = mine.find((s) => s.relay && !s.ready);
  if (missing) { g.text = `${missing.label} has no controller yet.`; g.sub = "Connect this laptop's controllers (bottom of the page): they take your alliance's robots by themselves."; }
  else if (notReady) { g.text = `${notReady.label} isn't ready: ${notReady.status}.`; g.sub = "Turn the robot on and run its program (VEXNET on). Its controller must be paired to it."; }
  else { g.text = `The ${role} alliance is ready: ${plural(mine.length, "robot")}.`; g.sub = "Keep this tab open. The game master starts the match."; }
  return g;
}

// The robot cards as one column per alliance, red first: RED 1 above RED 2, beside BLUE 1 above BLUE 2.
function allianceColumns(slots, card) {
  return ["red", "blue"].filter((a) => slots.some((s) => s.alliance === a)).map((a) =>
    h("div", { class: "alliance " + a }, h("h4", {}, a + " alliance"), slots.filter((s) => s.alliance === a).map(card)));
}

function viewMatch(code) {
  const role = getRole(code);
  if (!role) return go("#/role/" + code);   // a join link or a new device: say who you are first
  if (role === "tv") return go("#/tv/" + code);
  document.body.classList.toggle("nousb", role !== "red" && role !== "blue");
  const gm = role === "gm";
  setCrumb(["Home", "#/"], ["Match " + code]);
  let built = false;
  const el = {};

  async function act(body) {
    const { ok, data } = await post({ ...body, code });
    if (!ok) { el.err.textContent = data.error + (data.blockers && data.blockers.length > 1 ? " (+" + (data.blockers.length - 1) + " more)" : ""); return; }
    el.err.textContent = ""; if (data.closed) { store.set("vexnetLastMatch", ""); return go("#/"); } render(data);
  }

  function build(m) {
    el.title = h("h1", {}, m.typeTitle);
    el.code = h("div", { class: "code" }, m.code);
    el.share = h("button", { class: "small", onclick: () => { navigator.clipboard?.writeText(location.origin + "/#/join/" + code); el.share.textContent = "Link copied"; setTimeout(() => el.share.textContent = "Copy join link", 1500); } }, "Copy join link");
    el.steps = h("div", { class: "steps" }); el.next = h("div", { class: "next" });
    el.status = h("p", { class: "status" }); el.clock = h("p", { class: "clock" });
    // The big button does what comes next: START MATCH, START DRIVER CONTROL, PAUSE, RESUME.
    el.start = h("button", { class: "start", onclick: () => el.startAction && act({ action: el.startAction }) }, "START MATCH");
    el.skip = h("button", { class: "skip", onclick: () => act({ action: "start", skipAuto: true }) }, "SKIP AUTONOMOUS");
    el.stop = h("button", { class: "stop", onclick: () => act({ action: "stop" }) }, "STOP");
    el.reset = h("button", { class: "reset", onclick: () => act({ action: "reset" }) }, "RESET");
    el.err = h("div", { class: "err" });
    el.refereeRed = h("button", { class: "small", onclick: () => act({ action: "toggle", alliance: "red" }) });
    el.refereeBlue = h("button", { class: "small", onclick: () => act({ action: "toggle", alliance: "blue" }) });
    el.referee = h("div", { class: "row referee" }, h("span", { class: "muted" }, "Referee:"), el.refereeRed, el.refereeBlue);
    el.slots = h("div", { class: "slots" });
    el.laptops = h("div", { class: "laptops" });
    el.auto = h("button", { class: "small gold", onclick: () => act({ action: "autoassign" }) }, "Auto-assign controllers");
    el.end = h("button", { class: "end", onclick: () => {
      if (confirm("End this match? Every robot is disabled and released, and the match can't be restarted.")) act({ action: "end" });
    } }, "END MATCH");
    el.robotsSec = h("div", { class: "section block" }, h("div", { class: "row between", style: "margin-bottom:10px" }, h("h2", { style: "margin:0" }, "Robots"), el.auto), el.slots);
    el.laptopsSec = h("div", { class: "section block" }, h("h2", {}, "Laptops"), el.laptops);
    el.ctl = h("div", { class: "ctl" }, el.start, el.skip, el.stop, el.reset, el.end);
    el.youare = h("div", { class: "youare " + role },
      h("span", {}, "You are: ", ROLE_NAME[role], h("span", { class: "muted", style: "font-weight:400" },
        gm ? " - you run the match." : role === "watch" ? "" : " - the game master runs the match.")),
      h("span", { class: "row" },
        h("button", { class: "small ghost", onclick: changeRole }, "Change role"),
        h("button", { class: "small red", onclick: leaveMatch }, "Leave match")));
    app.replaceChildren(...[backButton(), el.youare,
      h("div", { class: "row between", style: "margin-bottom:12px" },
        h("div", {}, el.title, h("div", { class: "muted" }, "Other laptops join with this code")),
        h("div", { class: "row" }, el.code, el.share)),
      h("div", { class: "panel" }, el.steps, el.next),
      el.status, el.clock,
      gm ? el.ctl : null,
      gm ? el.referee : null, el.err,
      el.robotsSec, el.laptopsSec].filter(Boolean));   // parts only the game master gets
    if (!gm) el.auto.remove();
    built = true;
  }

  // Giving up your place: an alliance frees its side, the game master frees the controls for another device.
  // Giving up this device's place: an alliance laptop frees its spot (before START), the game master frees the controls.
  async function giveUpPlace() {
    if (role === "red" || role === "blue") await post({ action: "leave", code, relay: store.get("vexnetRelay") || usb.name }, false).catch(() => {});
    if (gm) await post({ action: "unclaim", code }).catch(() => {});
    if (store.get("vexnetJoinedMatch") === code && role !== "gm") store.set("vexnetJoinedMatch", "");
    setRole(code, "");
  }
  async function changeRole() { await giveUpPlace(); go("#/role/" + code); }

  // Leave the room: out of this match altogether, back home. Mid-match an alliance laptop's robots stop
  // hearing from it and disable themselves within 2 s, so it asks first.
  async function leaveMatch() {
    const live = el.lastPhase && ["countdown", "running", "paused", "waiting"].includes(el.lastPhase);
    const robots = role === "red" || role === "blue";
    if (!confirm(live && robots ? "The match is running: leaving disables your robots. Leave anyway?"
      : live && gm ? "The match is running and you are the game master: nobody can pause or stop it until another device takes over. Leave anyway?"
      : "Leave this match?")) return;
    stopPolling(); await giveUpPlace();
    if (store.get("vexnetLastMatch") === code) store.set("vexnetLastMatch", "");
    go("#/");
  }

  // Someone else has this seat now (a takeover, or the game master removed this laptop): back to choosing.
  function lostSeat(m) {
    if (gm && m.gmDevice && m.gmDevice !== device) return "Another device took over as game master.";
    if ((role === "red" || role === "blue") && !m.started && !(m.alliances[role] || []).includes(store.get("vexnetRelay") || usb.name))
      return `This laptop is no longer the ${role} alliance.`;
    return null;
  }

  function render(m) {
    if (m.ended) return showEnded(m);
    el.lastPhase = m.phase;
    const lost = lostSeat(m);
    if (lost) {
      setRole(code, ""); stopPolling();
      if (!gm && store.get("vexnetJoinedMatch") === code) store.set("vexnetJoinedMatch", "");
      alert(lost); return go("#/role/" + code);
    }
    // A game master from before claims existed (or one that let go): this device takes the empty seat.
    // Also when this device holds it but under no laptop name (claimed before names were sent) or an old one.
    if (gm && (!m.gmDevice || (m.gmDevice === device && m.gmLaptop !== usb.name)) && !el.claiming) {
      el.claiming = true; post({ action: "claim", code, laptop: usb.name }).finally(() => { el.claiming = false; });
    }
    gmLaptopInMatch = gm && m.joined.includes(usb.name);
    if (!built) build(m);
    store.set("vexnetLastMatch", m.code);
    setCrumb(["Home", "#/"], [`${m.typeTitle} · ${m.code}`]);

    // guide
    const g = gm ? guide(m) : allianceGuide(m, role);
    el.steps.replaceChildren(...g.steps.map((label, i) =>
      h("div", { class: "step " + (i < g.now ? "done" : i === g.now ? "now" : "") }, h("i", {}, i < g.now ? "✓" : String(i + 1)), label)));
    el.next.replaceChildren(h("span", { class: "tag" }, g.now >= 4 ? "NOW" : "NEXT"), h("div", {}, g.text, g.sub ? h("small", {}, g.sub) : null));
    const targets = { start: el.start, reset: el.reset, auto: el.auto, laptops: el.laptopsSec, slots: el.robotsSec };
    for (const [k, node] of Object.entries(targets)) node.classList.toggle(k === "laptops" || k === "slots" ? "hint" : "glow", g.target === k);

    el.status.textContent = m.status;
    el.clock.textContent = m.clockText; el.clock.style.color = m.clockColor;
    const live = ["countdown", "running", "paused", "waiting"].includes(m.phase);
    const [label, action, can] =
      m.canNext ? [`START ${m.periodTitle}`, "next", true]
      : m.canPause ? ["PAUSE", "pause", true]
      : m.canResume ? ["RESUME", "resume", true]
      : m.phase === "countdown" ? ["STARTING...", null, false]
      : m.phase === "running" ? [m.periodTitle, null, false]
      : m.phase === "ended" || m.phase === "stopped" ? ["RESET FIRST", null, false]
      : ["START MATCH", "start", m.canStart];
    el.startAction = action; el.start.textContent = label; el.start.disabled = !can;
    el.start.classList.toggle("pause", action === "pause");
    el.skip.style.display = m.hasAuto && !m.started ? "" : "none"; el.skip.disabled = !m.canSkipAuto;
    el.stop.disabled = !live; el.reset.disabled = !m.canReset;
    el.auto.style.display = m.started ? "none" : "";
    el.referee.style.display = ["running", "paused", "waiting"].includes(m.phase) ? "" : "none";
    for (const [a, btn] of [["red", el.refereeRed], ["blue", el.refereeBlue]]) {
      btn.style.display = m.slots.some((s) => s.alliance === a) ? "" : "none";
      btn.textContent = m.overrides[a] ? `Enable ${a.toUpperCase()}` : `Disable ${a.toUpperCase()}`;
    }
    // Robots: rebuilt only when something changed, so a dropdown being used isn't closed under the finger.
    // Only the controllers connected to the laptops in this match (plus whatever a slot already has).
    const options = [];
    for (const r of m.relays) if (r.joined) for (const p of r.connected || r.ports) options.push({ relay: r.name, port: p });
    for (const s of m.slots) if (s.relay && !options.some((o) => o.relay === s.relay && o.port === s.port)) options.push({ relay: s.relay, port: s.port, gone: true });
    const sig = JSON.stringify([m.slots.map((s) => [s.slot, s.relay, s.port, s.ready, s.status, m.enabled[s.alliance]]), options, m.started]);
    if (sig !== el.sig && !(el.slots.contains(document.activeElement) && document.activeElement.tagName === "SELECT")) {
      el.sig = sig;
      el.slots.replaceChildren(...allianceColumns(m.slots, (s) => {
        const sel = h("select", { disabled: m.started || !gm, "aria-label": `Controller for ${s.label}`, onchange: (e) => {
          const v = e.target.value;
          if (!v) return act({ action: "assign", slot: s.slot, clear: true });
          const [relay, port] = JSON.parse(v); act({ action: "assign", slot: s.slot, relay, port });
        } }, h("option", { value: "" }, options.some((o) => !o.gone) ? "- choose a controller -" : m.joined.length ? "- no controller connected -" : "- join a laptop first -"),
          options.filter((o) => !o.gone || (o.relay === s.relay && o.port === s.port)).map((o) =>
            h("option", { value: JSON.stringify([o.relay, o.port]), selected: o.relay === s.relay && o.port === s.port }, `${o.relay} · ${o.port}${o.gone ? " (not connected)" : ""}`)));
        const pill = m.started ? (m.enabled[s.alliance] ? ["on", "ENABLED"] : ["off", "DISABLED"]) : s.ready ? ["ok", "READY"] : s.relay ? ["wait", "WAITING"] : ["", "NO CONTROLLER"];
        return h("div", { class: "slot " + s.alliance },
          h("h3", {}, s.label, h("span", { class: "pill " + pill[0] }, pill[1])),
          h("div", { class: "st" }, s.status), sel);
      }));
    }
    // Laptops: the online ones, plus any that joined and went away (they keep their side until removed).
    const gone = m.members.filter((x) => !x.online).map((x) => ({ name: x.name, ports: [], joined: true, alliance: x.alliance, offline: true }));
    const laptops = [...m.relays, ...gone];
    const lsig = JSON.stringify([laptops, m.started, m.gmLaptop]);
    if (lsig !== el.lsig) {
      el.lsig = lsig;
      el.laptops.replaceChildren(...(laptops.length ? laptops.map((r) => h("div", { class: "laptop" },
        h("span", {}, h("b", {}, r.name), r.name === usb.name ? h("span", { class: "muted" }, " (this laptop)") : null,
          h("br"), h("span", { class: "muted" }, r.offline ? "offline" : r.ports.length ? plural(r.ports.length, "controller") + ": " + r.ports.join(", ") : "no controllers")),
        h("span", { class: "row" },
          r.name === m.gmLaptop ? h("span", { class: "pill", style: "background:var(--gold);color:#16120a" }, "GAME MASTER") : null,
          r.joined && (r.alliance || r.name !== m.gmLaptop) ? h("span", { class: "pill " + (r.alliance ? "" : "ok"), style: r.alliance ? `background:var(--${r.alliance});color:#0b0b0f` : "" }, r.alliance ? `${r.alliance.toUpperCase()} ALLIANCE` : "JOINED") : null,
          gm && r.joined && !m.started ? h("button", { class: "small ghost", onclick: () => {
            if (confirm(`Remove ${r.name} from this match?${r.alliance ? ` The ${r.alliance} alliance becomes free.` : ""}`)) act({ action: "kick", relay: r.name });
          } }, "Remove") : null,
          gm && !r.joined ? h("button", { class: "small gold", disabled: m.started, onclick: () => act({ action: "join", relay: r.name }) }, "Join") : null)))
        : [h("p", { class: "muted", style: "margin:0" }, "No laptops online. On each laptop with controllers, open this site in Chrome or Edge and press Connect controller.")]));
    }
    $("warn").style.display = m.storage === "memory" ? "block" : "none";
    sounds(m);
  }

  // The game master ended it: the same result on every screen, and nothing left to press but what comes next.
  function showEnded(m) {
    stopPolling();
    if (prev && prev.code === m.code && !prev.ended) tone(440, 900);
    prev = m;
    if (store.get("vexnetLastMatch") === code) store.set("vexnetLastMatch", "");
    setCrumb(["Home", "#/"], [`${m.typeTitle} · ${m.code}`]);
    const when = new Date(m.endedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    app.replaceChildren(
      h("div", { class: "panel final" },
        h("h1", {}, "Match ended"),
        h("p", { class: "lead", style: "margin:0" }, `${m.typeTitle} · ${m.code} · ended by the game master at ${when}`),
        h("p", { class: "status" }, m.status),
        h("p", { class: "clock" }, m.clockText),
        h("p", { class: "muted" }, "Every robot was released: it waits disabled for the next match.")),
      h("div", { class: "section slots" }, allianceColumns(m.slots, (s) => h("div", { class: "slot " + s.alliance },
        h("h3", {}, s.label), h("div", { class: "st" }, s.relay ? `${s.relay} · ${s.port}` : "no controller")))),
      h("div", { class: "section actions" },
        gm ? h("button", { class: "big primary", onclick: () => go("#/create") }, "Create the next match", h("small", {}, "Same laptops: they join it with the new code")) : null,
        h("button", { class: "big", onclick: () => go("#/") }, "Home", h("small", {}, gm ? "" : "Join the next match with its new code"))));
  }

  async function poll() {
    try {
      const r = await get("/api/match?code=" + code);
      if (r.status === 404) {
        stopPolling(); if (store.get("vexnetLastMatch") === code) store.set("vexnetLastMatch", "");
        if (store.get("vexnetJoinedMatch") === code) store.set("vexnetJoinedMatch", "");
        app.replaceChildren(backButton(), h("h1", {}, "Match not found"), h("p", { class: "lead" }, "That match was closed or the code is wrong."),
          h("button", { class: "small gold", onclick: () => go("#/") }, "Go home"));
        return;
      }
      lastOk = Date.now(); setConn(true, "connected"); render(r.data);
    } catch (e) { if (Date.now() - lastOk > 2500) setConn(false, "no connection"); }
  }
  app.replaceChildren(h("p", { class: "muted" }, "Loading match " + code + "..."));
  poll(); timer = setInterval(poll, 300);
}

// ─── Broadcast: the match full screen on a TV ─────────────────────────────────
// Read-only and fills the screen (sizes follow the screen's height, so a 1080p or 4K TV reads the same from across
// the room). No top bar, no controllers panel. One tap first: browsers only play sound after one, and it goes full screen.
function viewTv(code) {
  document.body.classList.add("tv");
  const el = {};
  el.title = h("div", { class: "title" }); el.code = h("div", { class: "tvcode" }, code);
  el.status = h("div", { class: "tvstatus" }); el.clock = h("div", { class: "tvclock" });
  el.sides = h("div", { class: "tvsides" }); el.join = h("div", { class: "tvjoin" });
  const tap = h("button", { class: "tvtap", onclick: () => {
    audioUnlock(); tone(1, 1); tap.remove();
    document.documentElement.requestFullscreen?.().catch(() => {});
  } }, h("span", {}, "Tap to start the broadcast (sound + full screen)"));
  app.replaceChildren(h("div", { class: "tvwrap" },
    h("div", { class: "tvtop" }, h("img", { src: "/qcu-robotics-logo.png", alt: "QCU Robotics" }), el.title, el.code),
    el.status, el.clock, el.sides, el.join), tap,
    h("button", { class: "small ghost tvexit", onclick: () => { setRole(code, ""); document.exitFullscreen?.().catch(() => {}); go("#/role/" + code); } }, "Exit broadcast"));

  function render(m) {
    el.title.textContent = m.typeTitle;
    el.status.textContent = m.ended ? "MATCH ENDED" : m.phase === "ready" ? "WAITING TO START" : m.status;
    el.clock.textContent = m.clockText; el.clock.style.color = m.ended ? "var(--gray)" : m.clockColor;
    const sides = ["red", "blue"].filter((a) => m.slots.some((s) => s.alliance === a));
    el.sides.className = "tvsides" + (sides.length === 1 ? " one" : "");
    const sig = JSON.stringify([m.slots.map((s) => [s.slot, s.relay, s.ready]), m.enabled, m.started, m.ended]);
    if (sig !== el.sig) {
      el.sig = sig;
      el.sides.replaceChildren(...sides.map((a) => h("div", { class: "tvside " + a },
        h("h3", {}, `${a.toUpperCase()} ALLIANCE`),
        m.slots.filter((s) => s.alliance === a).map((s) => {
          const pill = m.ended ? ["", "DONE"] : m.started ? (m.enabled[a] ? ["on", "ENABLED"] : ["off", "DISABLED"])
            : s.ready ? ["ok", "READY"] : s.relay ? ["wait", "WAITING"] : ["", "NO CONTROLLER"];
          return h("div", { class: "tvrobot" }, s.label, h("span", { class: "pill " + pill[0] }, pill[1]));
        }))));
    }
    // Before the match: how to join, big enough to read from the pits.
    el.join.replaceChildren(...(m.started || m.ended ? [] : ["Join at ", h("b", {}, location.host), " with code ", h("b", {}, m.code)]));
    sounds(m);
  }

  async function poll() {
    try {
      const r = await get("/api/match?code=" + code);
      if (r.status === 404) { el.status.textContent = "NO MATCH WITH THIS CODE"; el.clock.textContent = "-:--"; return; }
      render(r.data);
    } catch (e) { el.status.textContent = "RECONNECTING..."; }
  }
  poll(); timer = setInterval(poll, 300);
}

// ─── This laptop's controllers (USB, no relay.py needed) ───────────────────────
// An alliance laptop reports with the code of the match it joined; the game master's laptop with the PIN.
// gmLaptopInMatch: the game master's own laptop is one of the match's laptops (set by the match page).
let gmLaptopInMatch = false;
const usb = UsbRelay.create({ getPin: () => pin, getCode: () => store.get("vexnetJoinedMatch"),
  inMatch: () => Boolean(store.get("vexnetJoinedMatch")) || gmLaptopInMatch, onChange: () => renderUsb() });
const usbEl = {};
function buildUsb() {
  const box = $("usb");
  if (!usb.supported) {
    box.replaceChildren(h("h2", {}, "This laptop's controllers"),
      h("p", { class: "muted", style: "margin:0" }, "To use controllers plugged into this laptop, open this page in Chrome or Edge on it (or run relay.py)."));
    return;
  }
  usbEl.name = h("input", { value: usb.name, maxlength: 30, "aria-label": "Laptop name", title: "How this laptop is shown in matches",
    onchange: (e) => { usb.setName(e.target.value); e.target.value = usb.name; renderUsb(true); } });
  usbEl.list = h("div", { class: "laptops" });
  usbEl.note = h("div", { class: "usbnote" });
  usbEl.pin = h("button", { class: "small", style: "display:none", onclick: () => askPin("") }, "Enter PIN");
  box.replaceChildren(
    h("div", { class: "row between", style: "margin-bottom:10px" },
      h("h2", { style: "margin:0" }, "This laptop's controllers"),
      h("div", { class: "row" }, h("span", { class: "muted" }, "Laptop name"), usbEl.name,
        h("button", { class: "small gold", onclick: () => usb.connect().catch(() => {}) }, "Connect controller"))),
    usbEl.list, h("div", { class: "row" }, usbEl.note, usbEl.pin));
}
function renderUsb(force) {
  // top-bar chip
  const cs = usb.supported ? usb.controllers() : [];
  const ok = cs.filter((c) => c.ok).length;
  $("laptopDot").className = "dot " + (!cs.length ? "" : ok === cs.length && usb.online() ? "ok" : "warn");
  $("laptopText").textContent = usb.supported ? (cs.length ? `${usb.name} · ${plural(cs.length, "controller")}` : "No controllers") : "Watching";
  refreshHome?.();
  if (!usb.supported) return;
  const sig = JSON.stringify([cs, usb.note(), usb.online()]);
  if (sig === usbEl.sig && !force) return;
  usbEl.sig = sig;
  // The match finds this laptop's controllers by its name: renaming it mid-match would orphan its robots.
  const inMatch = cs.some((c) => c.slot);
  usbEl.name.disabled = inMatch; usbEl.name.title = inMatch ? "Can't rename while this laptop is in a match" : "How this laptop is shown in matches";
  usbEl.list.replaceChildren(...(cs.length ? cs.map((c) => h("div", { class: "ctrl" },
      h("span", {}, h("b", {}, c.name), "  ", h("span", { class: "muted" }, c.slot || "not in a match")),
      h("span", { style: "color:" + (c.ok ? "var(--green)" : "var(--gray)") }, c.robot)))
    : [h("p", { class: "muted", style: "margin:0" }, "Plug the controllers in by USB, then press Connect controller once for each (Chrome asks which one).")]));
  const note = usb.note() || (cs.length && !usb.online() ? "connecting to the website..." : "");
  usbEl.note.textContent = note ? note : cs.length ? "Keep this tab open while the match runs." : "";
  usbEl.note.style.color = note ? "" : "var(--gray)";
  usbEl.pin.style.display = /PIN/.test(note) ? "" : "none";
}
buildUsb(); renderUsb();

route();
</script>
</body>
</html>
